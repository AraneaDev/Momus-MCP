[package]
name = "momus-syn-wasm"
version = "0.0.4"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
syn = { version = "2", default-features = false, features = ["derive", "parsing", "printing", "clone-impls", "extra-traits", "full"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
serde_json = "1"
wee_alloc = "0.4"

[profile.release]
opt-level = "s"
lto = true
