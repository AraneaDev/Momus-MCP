name: Release Please

on:
  push:
    branches: [main]
  # release-please only ever runs on a push to main, so a release PR that goes
  # stale, or a run that failed, has no way back without a new commit. This
  # gives it one.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR + tag/release on merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Opens/updates the Release PR from Conventional Commits (release-please-config.json
      # + .release-please-manifest.json; single lockstep version for all @momus/* packages
      # via json extra-files). On merge of that PR, creates the vX.Y.Z tag + GitHub Release
      # and sets release_created=true.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # A Release PR opened with the built-in GITHUB_TOKEN arrives with no checks
          # on it, because GitHub does not start workflows for that token, and main
          # requires those checks. RELEASE_PLEASE_TOKEN raises the event as a real
          # account so the Release PR gets its own CI. Without the secret this still
          # works, but the Release PR then has to be closed and reopened once.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # Everything below runs ONLY on the merge that cut a release. Because the
      # tag/release are made with GITHUB_TOKEN, no separate tag-triggered
      # workflow would fire — so the released tree is verified here.
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - name: Setup Node
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci --no-audit --no-fund

      # Same gate that runs on every PR, against the released tree.
      - name: Typecheck + test
        if: ${{ steps.release.outputs.release_created }}
        run: |
          npm run typecheck
          npm test

      # NO npm publish step: publishing is a deliberate manual action (scripts/publish.mjs)
      # and is NOT part of CI, by project decision. Tags and GitHub Releases are cut
      # automatically; npm stays untouched until publishing is sanctioned.
