name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR + tag/release on merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Opens/updates the Release PR from Conventional Commits (release-please-config.json
      # + .release-please-manifest.json; single lockstep version for all @momus/* packages
      # via json extra-files). On merge of that PR, creates the vX.Y.Z tag + GitHub Release
      # and sets release_created=true.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Everything below runs ONLY on the merge that cut a release. Because the
      # tag/release are made with GITHUB_TOKEN, no separate tag-triggered
      # workflow would fire — so the released tree is verified here.
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci --no-audit --no-fund

      # Same gate that runs on every PR, against the released tree.
      - name: Typecheck + test
        if: ${{ steps.release.outputs.release_created }}
        run: |
          npm run typecheck
          npm test

      # NO npm publish step: publishing is a deliberate manual action (scripts/publish.mjs)
      # and is NOT part of CI, by project decision. Tags and GitHub Releases are cut
      # automatically; npm stays untouched until publishing is sanctioned.
