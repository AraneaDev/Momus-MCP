name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  commit-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so --all sees every commit

      # A release-please PR's diff is version files, the manifest, and a
      # CHANGELOG entry -- the code underneath is byte-identical to the main
      # it was cut from, which already ran this suite and passed. The step
      # below just re-verifies code that hasn't moved, so it's skipped when
      # the head branch is the one release-please owns. The job itself still
      # runs and reports: `commit-hygiene` and `test` are required checks on
      # main, and a required check that never reports leaves the PR blocked
      # forever, which is worse than a slow one. Every guard in this file
      # below is keyed on that same branch name.
      - name: Verify no Codebuff attribution footer in history
        if: github.head_ref != 'release-please--branches--main'
        run: node scripts/verify-no-codebuff-footer.mjs

  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Deterministic, no-network check that mirrors what release-please will do:
      # manifest/package versions lockstep, extra-files cover every workspace,
      # internal deps use ~ ranges, changelog-path + tag shape correct.
      #
      # This is the one check in the file that stays unguarded on a release
      # PR: it's verifying the version bump itself, not re-verifying code that
      # didn't change, so it runs in full every time.
      - name: Verify release-please config consistency
        run: node scripts/verify-release-config.mjs

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Lint/format/typecheck re-verify source that a release PR never
      # touches -- see the comment on commit-hygiene above.
      - name: Setup Node
        if: github.head_ref != 'release-please--branches--main'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: github.head_ref != 'release-please--branches--main'
        run: npm ci --no-audit --no-fund

      - name: Lint
        if: github.head_ref != 'release-please--branches--main'
        run: npm run lint

      - name: Format check
        if: github.head_ref != 'release-please--branches--main'
        run: npm run format:check

      - name: Typecheck
        if: github.head_ref != 'release-please--branches--main'
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # publishes the coverage badge to the gh-pages branch
    steps:
      - uses: actions/checkout@v7

      # Build + test re-verify source that a release PR never touches -- see
      # the comment on commit-hygiene above. `test` is one of the required
      # checks, so the job still has to run and report; only the expensive
      # work underneath is skipped.
      - name: Setup Node
        if: github.head_ref != 'release-please--branches--main'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: github.head_ref != 'release-please--branches--main'
        run: npm ci --no-audit --no-fund

      - name: Test with coverage
        if: github.head_ref != 'release-please--branches--main'
        run: npm run test:coverage

      # Self-hosted coverage badge: the percentage is published as a shields endpoint on an
      # orphan `gh-pages` branch, force-pushed so it stays a single commit and never grows
      # history. Only on main, because a pull request must not be able to move the badge, and
      # a fork's token cannot push anyway.
      - name: Publish coverage badge
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/badge
          node scripts/coverage-badge.mjs > /tmp/badge/coverage.json
          cat /tmp/badge/coverage.json
          cd /tmp/badge
          git init -q
          git checkout -q -b gh-pages
          git add coverage.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m 'chore: publish coverage badge'
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Self-audit gate (Momus audits its own tests)
        if: github.head_ref != 'release-please--branches--main'
        run: npm run audit-self

      - name: CLI smoke (fixture must fail, exit code 1)
        if: github.head_ref != 'release-please--branches--main'
        run: |
          # copy the fixture gallery to a temp dir (no .momusrc) so planted
          # violations are audited, then verify the exit-code contract.
          # NOTE: cd into the fixture first -- the CLI treats positional paths as
          # workspace-relative filters against root (default: cwd), so passing the
          # absolute /tmp path from the repo root silently audits nothing (false-green).
          rm -rf /tmp/momus-fixture && cp -r packages/parser-typescript/test/fixtures /tmp/momus-fixture
          cd /tmp/momus-fixture
          set +e
          # no --max-issues: the report must show the issue lines the greps below check
          "$GITHUB_WORKSPACE/node_modules/.bin/tsx" "$GITHUB_WORKSPACE/packages/cli/src/index.ts" audit . >/tmp/fixture-audit.txt 2>&1
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 for planted-violation fixture, got $code"
            cat /tmp/fixture-audit.txt
            exit 1
          fi
          grep -q "CLEAN:false" /tmp/fixture-audit.txt
          grep -q "TAUT-002" /tmp/fixture-audit.txt
          grep -q "DRIFT-001" /tmp/fixture-audit.txt
